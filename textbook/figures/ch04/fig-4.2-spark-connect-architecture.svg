<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="56" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">Spark Connect — thin client, remote driver</text>
  <text x="640" y="92" fill="#94a3b8" font-size="19" text-anchor="middle">The client builds a plan and ships it over gRPC; the driver runs on the cluster</text>

  <!-- CLASSIC (top) -->
  <text x="80" y="150" fill="#f87171" font-size="22" font-weight="700">Classic — embedded driver (spark-submit)</text>
  <g>
    <rect x="80" y="168" width="360" height="120" rx="14" fill="#3f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="260" y="206" fill="#fecaca" font-size="18" font-weight="700" text-anchor="middle">Your application process</text>
    <text x="260" y="234" fill="#fca5a5" font-size="14" text-anchor="middle">= the full driver: SparkContext,</text>
    <text x="260" y="254" fill="#fca5a5" font-size="14" text-anchor="middle">Catalyst, scheduler, big JVM</text>
    <text x="260" y="276" fill="#fca5a5" font-size="13" text-anchor="middle">client crash = job dies</text>
  </g>
  <text x="470" y="232" fill="#64748b" font-size="26">——▶</text>
  <rect x="560" y="168" width="300" height="120" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="710" y="222" fill="#cbd5e1" font-size="17" font-weight="700" text-anchor="middle">Cluster (executors)</text>
  <text x="710" y="250" fill="#94a3b8" font-size="14" text-anchor="middle">tightly coupled to the driver's</text>
  <text x="710" y="270" fill="#94a3b8" font-size="14" text-anchor="middle">exact Spark / JVM version</text>

  <line x1="120" y1="320" x2="1160" y2="320" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- CONNECT (bottom) -->
  <text x="80" y="372" fill="#38bdf8" font-size="22" font-weight="700">Spark Connect — thin client over gRPC</text>
  <g>
    <rect x="80" y="392" width="300" height="150" rx="14" fill="#12233b" stroke="#38bdf8" stroke-width="2"/>
    <text x="230" y="430" fill="#e0f2fe" font-size="18" font-weight="700" text-anchor="middle">Thin client</text>
    <text x="230" y="458" fill="#7dd3fc" font-size="14" text-anchor="middle">IDE · notebook · app · service</text>
    <text x="230" y="482" fill="#bae6fd" font-size="13" text-anchor="middle">builds a protobuf logical plan</text>
    <text x="230" y="508" fill="#bae6fd" font-size="13" text-anchor="middle">any language / version</text>
    <text x="230" y="530" fill="#94a3b8" font-size="12" text-anchor="middle">client crash ≠ driver crash</text>
  </g>

  <!-- gRPC pipe -->
  <g>
    <rect x="400" y="438" width="180" height="58" rx="8" fill="#0ea5e9"/>
    <text x="490" y="464" fill="#082f49" font-size="15" font-weight="700" text-anchor="middle">gRPC + protobuf</text>
    <text x="490" y="484" fill="#082f49" font-size="13" text-anchor="middle">sc://host:15002</text>
    <text x="490" y="516" fill="#38bdf8" font-size="13" text-anchor="middle">◀ Arrow result stream ▶</text>
  </g>

  <!-- Connect server -->
  <g>
    <rect x="600" y="392" width="280" height="150" rx="14" fill="#12233b" stroke="#38bdf8" stroke-width="2"/>
    <text x="740" y="430" fill="#e0f2fe" font-size="18" font-weight="700" text-anchor="middle">Spark Connect server</text>
    <text x="740" y="458" fill="#7dd3fc" font-size="14" text-anchor="middle">= the real driver</text>
    <text x="740" y="482" fill="#bae6fd" font-size="13" text-anchor="middle">analyze · optimize · schedule</text>
    <text x="740" y="508" fill="#bae6fd" font-size="13" text-anchor="middle">many isolated sessions</text>
  </g>
  <text x="890" y="472" fill="#64748b" font-size="26">——▶</text>
  <!-- cluster -->
  <g>
    <rect x="960" y="392" width="220" height="150" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="1070" y="440" fill="#cbd5e1" font-size="17" font-weight="700" text-anchor="middle">Cluster</text>
    <text x="1070" y="468" fill="#94a3b8" font-size="14" text-anchor="middle">executors</text>
    <text x="1070" y="500" fill="#94a3b8" font-size="13" text-anchor="middle">+ Unity Catalog OSS</text>
    <text x="1070" y="520" fill="#94a3b8" font-size="13" text-anchor="middle">(configured server-side)</text>
  </g>

  <!-- python usage strip -->
  <rect x="80" y="596" width="1100" height="80" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
  <text x="100" y="628" fill="#64748b" font-size="14" font-family="monospace">from pyspark.sql import SparkSession</text>
  <text x="100" y="656" fill="#7dd3fc" font-size="16" font-family="monospace" font-weight="700">spark = SparkSession.builder.remote("sc://localhost:15002").getOrCreate()</text>
</svg>
