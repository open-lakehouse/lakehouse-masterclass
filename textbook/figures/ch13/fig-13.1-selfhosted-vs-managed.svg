<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="58" fill="#f8fafc" font-size="34" font-weight="700" text-anchor="middle">Self-hosted vs. managed — same open stack</text>

  <!-- self-hosted -->
  <rect x="70" y="110" width="540" height="470" rx="18" fill="#0c2a3a" stroke="#22d3ee" stroke-width="3"/>
  <text x="340" y="152" fill="#a5f3fc" font-size="24" font-weight="700" text-anchor="middle">Self-hosted (this course)</text>
  <text x="340" y="182" fill="#67e8f9" font-size="14" text-anchor="middle">you run every process · laptop or your own cloud VMs</text>
  <g font-size="15">
    <rect x="110" y="210" width="460" height="46" rx="8" fill="#0f3d2e" stroke="#4ade80" stroke-width="1.5"/>
    <text x="128" y="239" fill="#d1fae5">SeaweedFS · Spark · Iceberg · Kafka · Airflow · MLflow</text>
    <rect x="110" y="272" width="460" height="46" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="128" y="301" fill="#e2e8f0">Unity Catalog OSS (Iceberg REST)</text>
    <rect x="110" y="334" width="460" height="46" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="128" y="363" fill="#e2e8f0">you patch, scale, and operate it</text>
  </g>
  <text x="340" y="430" fill="#94a3b8" font-size="14" text-anchor="middle">full control · no vendor bill · you own the ops</text>

  <!-- managed -->
  <rect x="670" y="110" width="540" height="470" rx="18" fill="#2a1f3d" stroke="#a78bfa" stroke-width="3"/>
  <text x="940" y="152" fill="#ddd6fe" font-size="24" font-weight="700" text-anchor="middle">Managed (a vendor runs it)</text>
  <text x="940" y="182" fill="#c4b5fd" font-size="14" text-anchor="middle">EMR · Databricks · MSK · managed Airflow</text>
  <g font-size="15">
    <rect x="710" y="210" width="460" height="46" rx="8" fill="#0f3d2e" stroke="#4ade80" stroke-width="1.5"/>
    <text x="728" y="239" fill="#d1fae5">S3 · managed Spark · Iceberg · managed Kafka</text>
    <rect x="710" y="272" width="460" height="46" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="728" y="301" fill="#e2e8f0">managed catalog (Iceberg REST compatible)</text>
    <rect x="710" y="334" width="460" height="46" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="728" y="363" fill="#e2e8f0">vendor patches, scales, and operates it</text>
  </g>
  <text x="940" y="430" fill="#94a3b8" font-size="14" text-anchor="middle">less ops · a bill · same open formats &amp; code</text>

  <!-- bridge -->
  <rect x="470" y="470" width="340" height="70" rx="14" fill="#3f2d1a" stroke="#fbbf24" stroke-width="3"/>
  <text x="640" y="502" fill="#fde68a" font-size="17" font-weight="700" text-anchor="middle">A lift, not a rewrite</text>
  <text x="640" y="525" fill="#fef3c7" font-size="13" text-anchor="middle">Iceberg + Spark + REST catalog port across</text>

  <g stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#a13)">
    <path d="M470 505 L610 415"/>
    <path d="M810 505 L940 415"/>
  </g>

  <text x="640" y="620" fill="#94a3b8" font-size="16" text-anchor="middle">Because you built on open standards, your data and pipelines move without re-modeling.</text>

  <defs>
    <marker id="a13" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24"/></marker>
  </defs>
</svg>
