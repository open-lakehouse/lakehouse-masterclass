<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="58" fill="#f8fafc" font-size="34" font-weight="700" text-anchor="middle">The agent loop: operate the lakehouse through tools</text>

  <!-- goal -->
  <rect x="440" y="105" width="400" height="70" rx="14" fill="#2e1f47" stroke="#a78bfa" stroke-width="3"/>
  <text x="640" y="140" fill="#ddd6fe" font-size="18" font-weight="700" text-anchor="middle">Goal (plain English)</text>
  <text x="640" y="162" fill="#c4b5fd" font-size="13" text-anchor="middle">"start the stack, run the medallion, report revenue"</text>

  <!-- loop nodes -->
  <g>
    <rect x="490" y="250" width="300" height="66" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="640" y="290" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">1 · Plan next step</text>

    <rect x="850" y="360" width="320" height="66" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="1010" y="393" fill="#dbeafe" font-size="17" font-weight="700" text-anchor="middle">2 · Call a tool</text>
    <text x="1010" y="414" fill="#93c5fd" font-size="12" text-anchor="middle" font-family="monospace">./lakehouse start | status | run</text>

    <rect x="490" y="470" width="300" height="66" rx="12" fill="#0f3d2e" stroke="#4ade80" stroke-width="2.5"/>
    <text x="640" y="503" fill="#d1fae5" font-size="18" font-weight="700" text-anchor="middle">3 · Observe output</text>
    <text x="640" y="524" fill="#a7f3d0" font-size="12" text-anchor="middle">status --json · command result</text>

    <rect x="110" y="360" width="300" height="66" rx="12" fill="#3f2d1a" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="260" y="393" fill="#fef3c7" font-size="17" font-weight="700" text-anchor="middle">4 · Goal met?</text>
    <text x="260" y="414" fill="#fde68a" font-size="12" text-anchor="middle">if not, loop · if yes, report</text>
  </g>

  <!-- loop arrows -->
  <g stroke="#64748b" stroke-width="2.5" fill="none">
    <path d="M640 175 L640 248" marker-end="url(#a12)"/>
    <path d="M790 285 C 900 300 970 330 1000 358" marker-end="url(#a12)"/>
    <path d="M1000 426 C 950 470 820 490 792 500" marker-end="url(#a12)"/>
    <path d="M490 503 C 320 500 280 460 270 428" marker-end="url(#a12)"/>
    <path d="M260 360 C 250 320 400 300 488 288" marker-end="url(#a12)"/>
  </g>

  <!-- skills side note -->
  <rect x="900" y="235" width="300" height="90" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1050" y="268" fill="#ddd6fe" font-size="15" font-weight="700" text-anchor="middle">Skills (.claude/skills)</text>
  <text x="1050" y="292" fill="#c4b5fd" font-size="12" text-anchor="middle">documented procedures</text>
  <text x="1050" y="311" fill="#c4b5fd" font-size="12" text-anchor="middle">tell the agent HOW</text>

  <text x="640" y="620" fill="#94a3b8" font-size="16" text-anchor="middle">A chatbot answers; an agent acts — planning, calling tools, observing, and adapting until the goal is met.</text>

  <defs>
    <marker id="a12" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
</svg>
