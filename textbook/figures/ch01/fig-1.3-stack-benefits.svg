<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="480" fill="#0f172a"/>
  <text x="640" y="60" fill="#f8fafc" font-size="34" font-weight="700" text-anchor="middle">The Open-Source Stack</text>
  <text x="640" y="96" fill="#94a3b8" font-size="19" text-anchor="middle">Every component is an industry-standard, portable open-source project</text>

  <!-- component chips -->
  <g text-anchor="middle">
    <g><rect x="70"  y="150" width="150" height="96" rx="14" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="145" y="200" fill="#e0f2fe" font-size="18" font-weight="700">SeaweedFS</text><text x="145" y="224" fill="#a5f3fc" font-size="14">object storage</text></g>
    <g><rect x="238" y="150" width="150" height="96" rx="14" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><text x="313" y="200" fill="#dbeafe" font-size="18" font-weight="700">Spark</text><text x="313" y="224" fill="#bfdbfe" font-size="14">compute</text></g>
    <g><rect x="406" y="150" width="150" height="96" rx="14" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><text x="481" y="200" fill="#dbeafe" font-size="18" font-weight="700">Iceberg</text><text x="481" y="224" fill="#bfdbfe" font-size="14">table format</text></g>
    <g><rect x="574" y="150" width="150" height="96" rx="14" fill="#3b2f63" stroke="#a78bfa" stroke-width="2"/><text x="649" y="200" fill="#ede9fe" font-size="18" font-weight="700">Kafka</text><text x="649" y="224" fill="#ddd6fe" font-size="14">event stream</text></g>
    <g><rect x="742" y="150" width="150" height="96" rx="14" fill="#3f2d1a" stroke="#fb923c" stroke-width="2"/><text x="817" y="200" fill="#ffedd5" font-size="18" font-weight="700">Airflow</text><text x="817" y="224" fill="#fed7aa" font-size="14">orchestration</text></g>
    <g><rect x="910" y="150" width="150" height="96" rx="14" fill="#0f3d2e" stroke="#34d399" stroke-width="2"/><text x="985" y="200" fill="#d1fae5" font-size="18" font-weight="700">DuckDB</text><text x="985" y="224" fill="#a7f3d0" font-size="14">serving engine</text></g>
    <g><rect x="1078" y="150" width="132" height="96" rx="14" fill="#0f3d2e" stroke="#34d399" stroke-width="2"/><text x="1144" y="200" fill="#d1fae5" font-size="18" font-weight="700">MLflow</text><text x="1144" y="224" fill="#a7f3d0" font-size="14">AI tracking</text></g>
  </g>

  <!-- three benefits -->
  <g text-anchor="middle">
    <g>
      <rect x="120" y="310" width="320" height="110" rx="16" fill="#12233b" stroke="#38bdf8" stroke-width="2"/>
      <text x="280" y="356" fill="#7dd3fc" font-size="22" font-weight="700">No lock-in</text>
      <text x="280" y="388" fill="#cbd5e1" font-size="16">Open standards, run anywhere</text>
    </g>
    <g>
      <rect x="480" y="310" width="320" height="110" rx="16" fill="#12233b" stroke="#38bdf8" stroke-width="2"/>
      <text x="640" y="356" fill="#7dd3fc" font-size="22" font-weight="700">No cloud bill</text>
      <text x="640" y="388" fill="#cbd5e1" font-size="16">Runs entirely on your laptop</text>
    </g>
    <g>
      <rect x="840" y="310" width="320" height="110" rx="16" fill="#12233b" stroke="#38bdf8" stroke-width="2"/>
      <text x="1000" y="356" fill="#7dd3fc" font-size="22" font-weight="700">Portable skills</text>
      <text x="1000" y="388" fill="#cbd5e1" font-size="16">Same stack behind Databricks/EMR</text>
    </g>
  </g>
</svg>
