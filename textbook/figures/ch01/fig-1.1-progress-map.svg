<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="320" fill="#0f172a"/>
  <text x="640" y="52" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="middle">Progress Map — the 10 layers you'll build</text>
  <text x="640" y="84" fill="#94a3b8" font-size="17" text-anchor="middle">This strip recurs in every chapter, highlighting where you are</text>

  <!-- 10 chips in build order left→right -->
  <g font-size="15" font-weight="600" text-anchor="middle">
    <g><rect x="40"  y="150" width="108" height="90" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="94"  y="188" fill="#a5f3fc">Storage</text><text x="94"  y="212" fill="#67e8f9" font-size="13">SeaweedFS</text></g>
    <g><rect x="156" y="150" width="108" height="90" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><text x="210" y="188" fill="#bfdbfe">Compute</text><text x="210" y="212" fill="#93c5fd" font-size="13">Spark</text></g>
    <g><rect x="272" y="150" width="108" height="90" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><text x="326" y="182" fill="#bfdbfe">Tables &amp;</text><text x="326" y="200" fill="#bfdbfe">Catalog</text><text x="326" y="222" fill="#93c5fd" font-size="13">Iceberg</text></g>
    <g><rect x="388" y="150" width="108" height="90" rx="10" fill="#3b2f63" stroke="#a78bfa" stroke-width="2"/><text x="442" y="188" fill="#ddd6fe">Ingestion</text><text x="442" y="212" fill="#c4b5fd" font-size="13">→ Bronze</text></g>
    <g><rect x="504" y="150" width="108" height="90" rx="10" fill="#3b2f63" stroke="#a78bfa" stroke-width="2"/><text x="558" y="182" fill="#ddd6fe">Transform</text><text x="558" y="200" fill="#ddd6fe">-ation</text><text x="558" y="222" fill="#c4b5fd" font-size="13">B→S→G</text></g>
    <g><rect x="620" y="150" width="108" height="90" rx="10" fill="#3b2f63" stroke="#a78bfa" stroke-width="2"/><text x="674" y="188" fill="#ddd6fe">Streaming</text><text x="674" y="212" fill="#c4b5fd" font-size="13">Kafka</text></g>
    <g><rect x="736" y="150" width="108" height="90" rx="10" fill="#3f2d1a" stroke="#fb923c" stroke-width="2"/><text x="790" y="182" fill="#fed7aa">Orchestr</text><text x="790" y="200" fill="#fed7aa">-ation</text><text x="790" y="222" fill="#fdba74" font-size="13">Airflow</text></g>
    <g><rect x="852" y="150" width="108" height="90" rx="10" fill="#0f3d2e" stroke="#34d399" stroke-width="2"/><text x="906" y="188" fill="#a7f3d0">Serving</text><text x="906" y="212" fill="#6ee7b7" font-size="13">DuckDB</text></g>
    <g><rect x="968" y="150" width="108" height="90" rx="10" fill="#0f3d2e" stroke="#34d399" stroke-width="2"/><text x="1022" y="188" fill="#a7f3d0">AI</text><text x="1022" y="212" fill="#6ee7b7" font-size="13">MLflow</text></g>
    <g><rect x="1084" y="150" width="108" height="90" rx="10" fill="#0f3d2e" stroke="#34d399" stroke-width="2"/><text x="1138" y="188" fill="#a7f3d0">Agents</text><text x="1138" y="212" fill="#6ee7b7" font-size="13">LLM + CLI</text></g>
  </g>

  <!-- connecting line -->
  <line x1="40" y1="270" x2="1192" y2="270" stroke="#334155" stroke-width="2"/>
  <text x="616" y="298" fill="#64748b" font-size="14" text-anchor="middle">bottom of stack ————————————————————— top of stack</text>
</svg>
