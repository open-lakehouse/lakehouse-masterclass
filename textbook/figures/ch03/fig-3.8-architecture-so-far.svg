<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="52" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">The architecture so far: one real service standing</text>
  <text x="640" y="90" fill="#94a3b8" font-size="20" text-anchor="middle">The object store runs and answers on the S3 API. Everything above it is still to come.</text>

  <defs>
    <marker id="arrowamber3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- LEFT: the live deployment -->
  <text x="360" y="132" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">Running now</text>

  <!-- Host box -->
  <rect x="70" y="150" width="580" height="470" rx="18" fill="#0b1120" stroke="#334155" stroke-width="2"/>
  <text x="96" y="182" fill="#cbd5e1" font-size="18" font-weight="700">Your laptop (host)</text>

  <!-- host S3 client chip -->
  <rect x="96" y="206" width="230" height="54" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="211" y="230" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">AWS CLI / S3 client</text>
  <text x="211" y="250" fill="#fbbf24" font-size="14" font-family="monospace" text-anchor="middle">localhost:8333</text>

  <!-- Docker + compose network -->
  <rect x="96" y="286" width="528" height="310" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="118" y="314" fill="#64748b" font-size="16" font-weight="700">Docker: lakehouse-network (private)</text>

  <!-- seaweedfs container -->
  <rect x="150" y="340" width="420" height="230" rx="16" fill="#1e293b" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="360" y="382" fill="#f1f5f9" font-size="24" font-weight="700" text-anchor="middle">seaweedfs</text>
  <text x="360" y="408" fill="#38bdf8" font-size="15" text-anchor="middle">object store container (image 3.80)</text>

  <rect x="186" y="428" width="348" height="44" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="360" y="456" fill="#38bdf8" font-size="15" font-family="monospace" text-anchor="middle">S3 API on port 8333</text>

  <rect x="186" y="484" width="348" height="44" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="360" y="512" fill="#7dd3fc" font-size="15" font-family="monospace" text-anchor="middle">bucket: s3://lakehouse</text>

  <rect x="186" y="536" width="348" height="20" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="360" y="551" fill="#64748b" font-size="12" text-anchor="middle">named volume: seaweedfs-data (bytes persist here)</text>

  <!-- arrow host client -> seaweedfs (published port) -->
  <line x1="211" y1="262" x2="211" y2="338" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowamber3)"/>
  <text x="252" y="306" fill="#fbbf24" font-size="12" text-anchor="start">published</text>
  <text x="252" y="322" fill="#fbbf24" font-size="12" text-anchor="start">8333:8333</text>

  <!-- RIGHT: the layers still to come -->
  <text x="960" y="132" fill="#64748b" font-size="20" font-weight="700" text-anchor="middle">Still to come</text>
  <rect x="700" y="150" width="510" height="470" rx="18" fill="#0b1120" stroke="#1f2937" stroke-width="2"/>

  <!-- dimmed layer chips, top of stack downward -->
  <rect x="730" y="176" width="450" height="40" rx="8" fill="#0f172a" stroke="#243044" stroke-width="1.5"/>
  <text x="955" y="202" fill="#475569" font-size="15" text-anchor="middle">Agents  (Chapter 12)</text>
  <rect x="730" y="222" width="450" height="40" rx="8" fill="#0f172a" stroke="#243044" stroke-width="1.5"/>
  <text x="955" y="248" fill="#475569" font-size="15" text-anchor="middle">AI  (Chapter 11)</text>
  <rect x="730" y="268" width="450" height="40" rx="8" fill="#0f172a" stroke="#243044" stroke-width="1.5"/>
  <text x="955" y="294" fill="#475569" font-size="15" text-anchor="middle">Serving  (Chapter 10)</text>
  <rect x="730" y="314" width="450" height="40" rx="8" fill="#0f172a" stroke="#243044" stroke-width="1.5"/>
  <text x="955" y="340" fill="#475569" font-size="15" text-anchor="middle">Orchestration / Streaming  (Chapters 8-9)</text>
  <rect x="730" y="360" width="450" height="40" rx="8" fill="#0f172a" stroke="#243044" stroke-width="1.5"/>
  <text x="955" y="386" fill="#475569" font-size="15" text-anchor="middle">Ingestion / Transformation  (Chapters 6-7)</text>
  <rect x="730" y="406" width="450" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="955" y="432" fill="#64748b" font-size="15" text-anchor="middle">Tables and Catalog: Iceberg via Unity Catalog OSS  (Chapter 5)</text>
  <rect x="730" y="452" width="450" height="40" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="955" y="478" fill="#93c5fd" font-size="15" text-anchor="middle">Compute: Spark + Spark Connect  (Chapter 4, next)</text>

  <!-- next-up ghost of spark joining the network -->
  <rect x="730" y="512" width="450" height="88" rx="12" fill="#0b1120" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="955" y="542" fill="#93c5fd" font-size="15" font-weight="700" text-anchor="middle">Next chapter</text>
  <text x="955" y="566" fill="#94a3b8" font-size="14" text-anchor="middle">Spark joins lakehouse-network and reads the store</text>
  <text x="955" y="588" fill="#60a5fa" font-size="14" font-family="monospace" text-anchor="middle">http://seaweedfs:8333  (by service name)</text>
</svg>
