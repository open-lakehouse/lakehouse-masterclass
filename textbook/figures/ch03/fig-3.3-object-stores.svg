<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="60" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">Object stores — where the bytes live</text>
  <text x="640" y="98" fill="#94a3b8" font-size="20" text-anchor="middle">All three speak the same S3 API, so your code doesn't change when you switch</text>

  <!-- The S3 API bus -->
  <rect x="120" y="150" width="1040" height="60" rx="12" fill="#0ea5e9" opacity="0.9"/>
  <text x="640" y="188" fill="#082f49" font-size="24" font-weight="700" text-anchor="middle">S3 API  —  the universal object-storage interface</text>

  <!-- connectors -->
  <g stroke="#38bdf8" stroke-width="3">
    <line x1="280" y1="210" x2="280" y2="270"/>
    <line x1="640" y1="210" x2="640" y2="270"/>
    <line x1="1000" y1="210" x2="1000" y2="270"/>
  </g>

  <!-- Amazon S3 -->
  <g>
    <rect x="140" y="270" width="280" height="330" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="280" y="316" fill="#f1f5f9" font-size="24" font-weight="700" text-anchor="middle">Amazon S3</text>
    <text x="280" y="346" fill="#94a3b8" font-size="16" text-anchor="middle">the cloud original</text>
    <line x1="170" y1="368" x2="390" y2="368" stroke="#334155"/>
    <text x="280" y="404" fill="#4ade80" font-size="16" text-anchor="middle">✓ Infinite, durable, managed</text>
    <text x="280" y="436" fill="#4ade80" font-size="16" text-anchor="middle">✓ Zero ops</text>
    <text x="280" y="468" fill="#f87171" font-size="16" text-anchor="middle">✗ Needs a cloud account</text>
    <text x="280" y="500" fill="#f87171" font-size="16" text-anchor="middle">✗ Costs money to run</text>
    <text x="280" y="560" fill="#64748b" font-size="15" text-anchor="middle">Great for production on AWS</text>
  </g>

  <!-- MinIO -->
  <g>
    <rect x="500" y="270" width="280" height="330" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="640" y="316" fill="#f1f5f9" font-size="24" font-weight="700" text-anchor="middle">MinIO</text>
    <text x="640" y="346" fill="#94a3b8" font-size="16" text-anchor="middle">self-hosted S3</text>
    <line x1="530" y1="368" x2="750" y2="368" stroke="#334155"/>
    <text x="640" y="404" fill="#4ade80" font-size="16" text-anchor="middle">✓ Runs anywhere, free</text>
    <text x="640" y="436" fill="#4ade80" font-size="16" text-anchor="middle">✓ Very popular in labs</text>
    <text x="640" y="468" fill="#4ade80" font-size="16" text-anchor="middle">✓ Full S3 compatibility</text>
    <text x="640" y="500" fill="#fbbf24" font-size="16" text-anchor="middle">~ Heavier footprint</text>
    <text x="640" y="560" fill="#64748b" font-size="15" text-anchor="middle">A common local alternative</text>
  </g>

  <!-- SeaweedFS (chosen) -->
  <g>
    <rect x="860" y="270" width="280" height="330" rx="16" fill="#12233b" stroke="#22d3ee" stroke-width="3"/>
    <text x="1000" y="316" fill="#f1f5f9" font-size="24" font-weight="700" text-anchor="middle">SeaweedFS</text>
    <text x="1000" y="346" fill="#67e8f9" font-size="16" text-anchor="middle">our choice for this course</text>
    <line x1="890" y1="368" x2="1110" y2="368" stroke="#1e3a52"/>
    <text x="1000" y="404" fill="#4ade80" font-size="16" text-anchor="middle">✓ Lightweight &amp; fast</text>
    <text x="1000" y="436" fill="#4ade80" font-size="16" text-anchor="middle">✓ Tiny RAM footprint</text>
    <text x="1000" y="468" fill="#4ade80" font-size="16" text-anchor="middle">✓ S3 API — laptop friendly</text>
    <text x="1000" y="500" fill="#4ade80" font-size="16" text-anchor="middle">✓ Free &amp; open source</text>
    <rect x="900" y="536" width="200" height="40" rx="20" fill="#0891b2"/>
    <text x="1000" y="562" fill="#ecfeff" font-size="16" font-weight="700" text-anchor="middle">★ we use this</text>
  </g>

  <text x="640" y="668" fill="#38bdf8" font-size="18" font-weight="600" text-anchor="middle">Because they share the S3 API, moving from SeaweedFS on your laptop to S3 in the cloud is a config change, not a rewrite</text>
</svg>
