<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="58" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">Open table formats — how files become a table</text>
  <text x="640" y="96" fill="#94a3b8" font-size="20" text-anchor="middle">A metadata layer on top of Parquet files adds ACID, schema, and time travel</text>

  <!-- the two-layer stack model -->
  <g>
    <rect x="120" y="140" width="1040" height="52" rx="10" fill="#0ea5e9" opacity="0.9"/>
    <text x="640" y="174" fill="#082f49" font-size="20" font-weight="700" text-anchor="middle">TABLE FORMAT (metadata) — Iceberg / Delta / Hudi</text>
    <rect x="120" y="196" width="1040" height="46" rx="10" fill="#334155"/>
    <text x="640" y="226" fill="#e2e8f0" font-size="18" font-weight="600" text-anchor="middle">FILE FORMAT — Parquet columnar files</text>
    <rect x="120" y="246" width="1040" height="42" rx="10" fill="#164e63"/>
    <text x="640" y="273" fill="#a5f3fc" font-size="17" font-weight="600" text-anchor="middle">OBJECT STORE — SeaweedFS / S3 (the bytes)</text>
  </g>

  <!-- three format cards -->
  <g>
    <!-- Iceberg (chosen) -->
    <rect x="120" y="330" width="320" height="300" rx="16" fill="#12233b" stroke="#38bdf8" stroke-width="3"/>
    <text x="280" y="374" fill="#f1f5f9" font-size="24" font-weight="700" text-anchor="middle">Apache Iceberg</text>
    <text x="280" y="402" fill="#7dd3fc" font-size="15" text-anchor="middle">our choice</text>
    <line x1="150" y1="420" x2="410" y2="420" stroke="#1e3a52"/>
    <text x="280" y="452" fill="#cbd5e1" font-size="15" text-anchor="middle">Engine-neutral by design</text>
    <text x="280" y="480" fill="#cbd5e1" font-size="15" text-anchor="middle">Spark, Flink, Trino, DuckDB</text>
    <text x="280" y="508" fill="#cbd5e1" font-size="15" text-anchor="middle">Hidden partitioning</text>
    <text x="280" y="536" fill="#cbd5e1" font-size="15" text-anchor="middle">Strong open governance</text>
    <rect x="180" y="566" width="200" height="40" rx="20" fill="#0369a1"/>
    <text x="280" y="592" fill="#e0f2fe" font-size="16" font-weight="700" text-anchor="middle">★ we use this</text>
  </g>

  <!-- Delta -->
  <g>
    <rect x="480" y="330" width="320" height="300" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="640" y="374" fill="#f1f5f9" font-size="24" font-weight="700" text-anchor="middle">Delta Lake</text>
    <text x="640" y="402" fill="#94a3b8" font-size="15" text-anchor="middle">Databricks-born</text>
    <line x1="510" y1="420" x2="770" y2="420" stroke="#334155"/>
    <text x="640" y="452" fill="#cbd5e1" font-size="15" text-anchor="middle">Excellent on Spark</text>
    <text x="640" y="480" fill="#cbd5e1" font-size="15" text-anchor="middle">Native to Databricks</text>
    <text x="640" y="508" fill="#cbd5e1" font-size="15" text-anchor="middle">Transaction log (_delta_log)</text>
    <text x="640" y="536" fill="#94a3b8" font-size="15" text-anchor="middle">Historically Spark-centric</text>
  </g>

  <!-- Hudi -->
  <g>
    <rect x="840" y="330" width="320" height="300" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="1000" y="374" fill="#f1f5f9" font-size="24" font-weight="700" text-anchor="middle">Apache Hudi</text>
    <text x="1000" y="402" fill="#94a3b8" font-size="15" text-anchor="middle">upsert-focused</text>
    <line x1="870" y1="420" x2="1130" y2="420" stroke="#334155"/>
    <text x="1000" y="452" fill="#cbd5e1" font-size="15" text-anchor="middle">Strong incremental upserts</text>
    <text x="1000" y="480" fill="#cbd5e1" font-size="15" text-anchor="middle">CDC-oriented workloads</text>
    <text x="1000" y="508" fill="#cbd5e1" font-size="15" text-anchor="middle">Record-level indexes</text>
    <text x="1000" y="536" fill="#94a3b8" font-size="15" text-anchor="middle">Steeper learning curve</text>
  </g>

  <text x="640" y="676" fill="#38bdf8" font-size="18" font-weight="600" text-anchor="middle">All three solve the same problem. We pick Iceberg for its engine-neutrality — the heart of the "open" promise.</text>
</svg>
