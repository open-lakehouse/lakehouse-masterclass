<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#0f172a"/>
  <text x="640" y="56" fill="#f8fafc" font-size="32" font-weight="700" text-anchor="middle">Every tool call passes the policies first</text>

  <!-- model -->
  <rect x="60" y="150" width="260" height="110" rx="14" fill="#2e1f47" stroke="#a78bfa" stroke-width="3"/>
  <text x="190" y="194" fill="#ddd6fe" font-size="20" font-weight="700" text-anchor="middle">Local model</text>
  <text x="190" y="220" fill="#c4b5fd" font-size="13" text-anchor="middle">Ollama, sdp-qwen3</text>
  <text x="190" y="242" fill="#c4b5fd" font-size="13" text-anchor="middle">proposes the next tool call</text>

  <!-- omnigent box -->
  <rect x="380" y="110" width="520" height="440" rx="18" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="640" y="142" fill="#94a3b8" font-size="15" text-anchor="middle">Omnigent session (agents/sdp_agent/agent.yaml)</text>

  <rect x="420" y="165" width="440" height="200" rx="14" fill="#3f2d1a" stroke="#fbbf24" stroke-width="3"/>
  <text x="640" y="198" fill="#fef3c7" font-size="20" font-weight="700" text-anchor="middle">Policies, in declaration order</text>
  <text x="640" y="228" fill="#fde68a" font-size="14" text-anchor="middle" font-family="monospace">tool_call_budget</text>
  <text x="640" y="250" fill="#fde68a" font-size="14" text-anchor="middle" font-family="monospace">stay_in_sandbox</text>
  <text x="640" y="272" fill="#fde68a" font-size="14" text-anchor="middle" font-family="monospace">sql_writes</text>
  <text x="640" y="294" fill="#fde68a" font-size="14" text-anchor="middle" font-family="monospace">dry_run_first</text>
  <text x="640" y="316" fill="#fde68a" font-size="14" text-anchor="middle" font-family="monospace">driver_pulls</text>
  <text x="640" y="346" fill="#fbbf24" font-size="13" text-anchor="middle">the first DENY wins; an ASK waits for you</text>

  <rect x="420" y="410" width="440" height="110" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="3"/>
  <text x="640" y="446" fill="#dbeafe" font-size="20" font-weight="700" text-anchor="middle">MCP server: lakehouse.agent_mcp</text>
  <text x="640" y="472" fill="#93c5fd" font-size="13" text-anchor="middle" font-family="monospace">list / read / write_pipeline_file</text>
  <text x="640" y="494" fill="#93c5fd" font-size="13" text-anchor="middle" font-family="monospace">dry_run · run · sql</text>

  <!-- stack -->
  <rect x="960" y="410" width="260" height="110" rx="14" fill="#0f3d2e" stroke="#4ade80" stroke-width="3"/>
  <text x="1090" y="450" fill="#d1fae5" font-size="20" font-weight="700" text-anchor="middle">The lakehouse</text>
  <text x="1090" y="476" fill="#a7f3d0" font-size="13" text-anchor="middle">pipelines/sandbox_sdp/</text>
  <text x="1090" y="498" fill="#a7f3d0" font-size="13" text-anchor="middle">Spark Connect, iceberg.sandbox_sdp</text>

  <!-- verdict outcomes -->
  <rect x="960" y="165" width="260" height="200" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="1090" y="200" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">Verdicts</text>
  <text x="985" y="238" fill="#4ade80" font-size="15" font-weight="700">ALLOW</text>
  <text x="1060" y="238" fill="#cbd5e1" font-size="13">the tool runs</text>
  <text x="985" y="276" fill="#f87171" font-size="15" font-weight="700">DENY</text>
  <text x="1060" y="276" fill="#cbd5e1" font-size="13">the model gets</text>
  <text x="1060" y="294" fill="#cbd5e1" font-size="13">the reason instead</text>
  <text x="985" y="332" fill="#fbbf24" font-size="15" font-weight="700">ASK</text>
  <text x="1060" y="332" fill="#cbd5e1" font-size="13">you approve or refuse</text>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="2.5" fill="none">
    <path d="M320 200 L418 200" marker-end="url(#a3)"/>
    <path d="M640 365 L640 408" marker-end="url(#a3)"/>
    <path d="M860 465 L958 465" marker-end="url(#a3)"/>
    <path d="M860 265 L958 265" marker-end="url(#a3)"/>
    <path d="M420 300 C 340 300 300 280 300 262" marker-end="url(#a3)"/>
    <path d="M420 480 C 300 480 200 400 190 262" marker-end="url(#a3)"/>
  </g>
  <text x="330" y="190" fill="#94a3b8" font-size="12">tool call</text>
  <text x="250" y="330" fill="#f87171" font-size="12">DENY reason</text>
  <text x="210" y="450" fill="#94a3b8" font-size="12">tool result (checked too)</text>

  <text x="640" y="600" fill="#64748b" font-size="14" text-anchor="middle">Policies run in Omnigent, outside the model: a model can ignore its instructions, but not a DENY.</text>
</svg>
