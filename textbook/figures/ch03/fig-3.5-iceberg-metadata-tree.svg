<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="54" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">What an Iceberg table is: a tree of metadata over Parquet</text>
  <text x="640" y="92" fill="#94a3b8" font-size="20" text-anchor="middle">A commit writes new metadata and swaps one pointer, so it is atomic</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Catalog pointer -->
  <rect x="80" y="150" width="250" height="90" rx="14" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
  <text x="205" y="188" fill="#f1f5f9" font-size="20" font-weight="700" text-anchor="middle">Catalog</text>
  <text x="205" y="214" fill="#94a3b8" font-size="14" text-anchor="middle">(Unity Catalog OSS)</text>
  <text x="205" y="232" fill="#64748b" font-size="12" text-anchor="middle">points at the current metadata</text>

  <!-- metadata.json (current pointer) -->
  <rect x="80" y="300" width="250" height="110" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="205" y="336" fill="#93c5fd" font-size="18" font-weight="700" text-anchor="middle">metadata.json</text>
  <text x="205" y="360" fill="#cbd5e1" font-size="13" text-anchor="middle">schema, partition spec,</text>
  <text x="205" y="380" fill="#cbd5e1" font-size="13" text-anchor="middle">list of snapshots,</text>
  <text x="205" y="400" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">current-snapshot pointer</text>

  <line x1="205" y1="240" x2="205" y2="298" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Manifest list (snapshot) -->
  <rect x="400" y="300" width="250" height="110" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="525" y="336" fill="#c084fc" font-size="17" font-weight="700" text-anchor="middle">manifest list</text>
  <text x="525" y="358" fill="#94a3b8" font-size="13" text-anchor="middle">one per snapshot</text>
  <text x="525" y="380" fill="#cbd5e1" font-size="13" text-anchor="middle">which manifests make up</text>
  <text x="525" y="398" fill="#cbd5e1" font-size="13" text-anchor="middle">the table at this snapshot</text>
  <line x1="330" y1="355" x2="398" y2="355" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Manifests -->
  <rect x="720" y="288" width="230" height="60" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="835" y="315" fill="#4ade80" font-size="16" font-weight="700" text-anchor="middle">manifest A</text>
  <text x="835" y="336" fill="#64748b" font-size="12" text-anchor="middle">lists data files + their stats</text>
  <rect x="720" y="362" width="230" height="60" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="835" y="389" fill="#4ade80" font-size="16" font-weight="700" text-anchor="middle">manifest B</text>
  <text x="835" y="410" fill="#64748b" font-size="12" text-anchor="middle">lists data files + their stats</text>
  <line x1="650" y1="340" x2="718" y2="318" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="368" x2="718" y2="392" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Data files -->
  <rect x="1010" y="270" width="200" height="46" rx="8" fill="#3f2d0a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1110" y="298" fill="#fcd34d" font-size="13" font-family="monospace" text-anchor="middle">00000.parquet</text>
  <rect x="1010" y="324" width="200" height="46" rx="8" fill="#3f2d0a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1110" y="352" fill="#fcd34d" font-size="13" font-family="monospace" text-anchor="middle">00001.parquet</text>
  <rect x="1010" y="378" width="200" height="46" rx="8" fill="#3f2d0a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1110" y="406" fill="#fcd34d" font-size="13" font-family="monospace" text-anchor="middle">00002.parquet</text>
  <line x1="950" y1="316" x2="1008" y2="296" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="392" x2="1008" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer labels along the bottom -->
  <text x="205" y="452" fill="#64748b" font-size="13" text-anchor="middle">the pointer you swap</text>
  <text x="525" y="452" fill="#64748b" font-size="13" text-anchor="middle">the snapshot</text>
  <text x="835" y="452" fill="#64748b" font-size="13" text-anchor="middle">file index + stats</text>
  <text x="1110" y="452" fill="#64748b" font-size="13" text-anchor="middle">the actual bytes</text>

  <!-- Two payoff callouts -->
  <rect x="80" y="500" width="560" height="120" rx="12" fill="#0b1120" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="104" y="532" fill="#93c5fd" font-size="17" font-weight="700">Atomic commit + time travel</text>
  <text x="104" y="560" fill="#cbd5e1" font-size="14">A write adds new data files, a new manifest list, and a new</text>
  <text x="104" y="582" fill="#cbd5e1" font-size="14">metadata.json, then flips the current-snapshot pointer in one step.</text>
  <text x="104" y="604" fill="#94a3b8" font-size="14">Old snapshots still exist, so you can query or roll back to them.</text>

  <rect x="660" y="500" width="550" height="120" rx="12" fill="#0b1120" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="684" y="532" fill="#38bdf8" font-size="17" font-weight="700">File pruning before any file is opened</text>
  <text x="684" y="560" fill="#cbd5e1" font-size="14">Manifests carry each data file's column stats, so the engine</text>
  <text x="684" y="582" fill="#cbd5e1" font-size="14">drops files that cannot match a filter during planning,</text>
  <text x="684" y="604" fill="#94a3b8" font-size="14">without a directory listing and without opening Parquet footers.</text>
</svg>
