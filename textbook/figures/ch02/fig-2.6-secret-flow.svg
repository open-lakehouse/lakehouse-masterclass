<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="56" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">How a secret reaches a service</text>
  <text x="640" y="94" fill="#94a3b8" font-size="20" text-anchor="middle">Kept in one gitignored file, injected at runtime, never committed</text>

  <defs>
    <marker id="g" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- .env -->
  <rect x="70" y="230" width="300" height="170" rx="14" fill="#1a1420" stroke="#f59e0b" stroke-width="2"/>
  <text x="220" y="270" fill="#fbbf24" font-size="22" font-weight="700" text-anchor="middle" font-family="monospace">.env</text>
  <text x="220" y="298" fill="#94a3b8" font-size="15" text-anchor="middle">gitignored, never committed</text>
  <rect x="100" y="316" width="240" height="60" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="220" y="352" fill="#e2e8f0" font-size="15" font-family="monospace" text-anchor="middle">MINIO_PASSWORD=...</text>

  <!-- arrow to compose -->
  <line x1="370" y1="315" x2="470" y2="315" stroke="#4ade80" stroke-width="3" marker-end="url(#g)"/>
  <text x="420" y="300" fill="#86efac" font-size="13" text-anchor="middle">read by</text>

  <!-- compose -->
  <rect x="475" y="230" width="330" height="170" rx="14" fill="#0b1120" stroke="#334155" stroke-width="2"/>
  <text x="640" y="268" fill="#cbd5e1" font-size="19" font-weight="700" text-anchor="middle" font-family="monospace">docker-compose.yml</text>
  <text x="640" y="294" fill="#94a3b8" font-size="14" text-anchor="middle">committed, no secret in it</text>
  <rect x="500" y="312" width="280" height="66" rx="8" fill="#111c2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="640" y="338" fill="#94a3b8" font-size="13" font-family="monospace" text-anchor="middle">environment:</text>
  <text x="640" y="360" fill="#38bdf8" font-size="13" font-family="monospace" text-anchor="middle">PASSWORD=${MINIO_PASSWORD}</text>

  <!-- arrow to container -->
  <line x1="805" y1="315" x2="905" y2="315" stroke="#4ade80" stroke-width="3" marker-end="url(#g)"/>
  <text x="855" y="300" fill="#86efac" font-size="13" text-anchor="middle">injected</text>

  <!-- container -->
  <rect x="910" y="230" width="300" height="170" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <text x="1060" y="270" fill="#f1f5f9" font-size="20" font-weight="700" text-anchor="middle">minio container</text>
  <text x="1060" y="298" fill="#94a3b8" font-size="15" text-anchor="middle">at runtime, in memory</text>
  <rect x="940" y="316" width="240" height="60" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <text x="1060" y="352" fill="#4ade80" font-size="15" font-family="monospace" text-anchor="middle">✓ has the password</text>

  <!-- anti-patterns bar -->
  <rect x="70" y="470" width="1140" height="180" rx="16" fill="#1a1420" stroke="#7f1d1d" stroke-width="2"/>
  <text x="640" y="512" fill="#f87171" font-size="22" font-weight="700" text-anchor="middle">Never do these</text>
  <g>
    <text x="120" y="558" fill="#fca5a5" font-size="17">✗</text>
    <text x="150" y="558" fill="#e2e8f0" font-size="17">Hardcode a secret in docker-compose.yml</text>
    <text x="150" y="582" fill="#64748b" font-size="14">the file is committed, so the secret lands in your git history forever</text>
  </g>
  <g>
    <text x="120" y="620" fill="#fca5a5" font-size="17">✗</text>
    <text x="150" y="620" fill="#e2e8f0" font-size="17">Bake a secret into a container image</text>
    <text x="150" y="644" fill="#64748b" font-size="14">images get pushed and shared, and anyone who pulls it gets the secret</text>
  </g>
  <g>
    <text x="700" y="558" fill="#86efac" font-size="17">✓</text>
    <text x="730" y="558" fill="#e2e8f0" font-size="17">Keep secrets in .env, inject at runtime</text>
    <text x="730" y="582" fill="#64748b" font-size="14">config and code are shareable; secrets stay out of both</text>
  </g>
  <g>
    <text x="700" y="620" fill="#fbbf24" font-size="16">→</text>
    <text x="730" y="620" fill="#e2e8f0" font-size="17">In production: a secret manager</text>
    <text x="730" y="644" fill="#64748b" font-size="14">Vault or a cloud service, same runtime-injection habit, with rotation and audit</text>
  </g>
</svg>
