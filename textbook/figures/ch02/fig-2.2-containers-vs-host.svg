<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="56" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">Why containers, not installs</text>
  <text x="640" y="94" fill="#94a3b8" font-size="20" text-anchor="middle">The same four services, installed on your host versus isolated in containers</text>

  <!-- LEFT: installed on host -->
  <rect x="70" y="140" width="520" height="500" rx="20" fill="#1a1420" stroke="#7f1d1d" stroke-width="2"/>
  <text x="330" y="182" fill="#f87171" font-size="24" font-weight="700" text-anchor="middle">Installed on your host</text>
  <text x="330" y="212" fill="#94a3b8" font-size="16" text-anchor="middle">everything shares one machine's libraries</text>

  <!-- host machine slab -->
  <rect x="110" y="240" width="440" height="360" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="330" y="268" fill="#cbd5e1" font-size="15" font-weight="600" text-anchor="middle">your OS + one shared set of dependencies</text>

  <rect x="140" y="290" width="180" height="60" rx="8" fill="#1e293b" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="230" y="318" fill="#e2e8f0" font-size="15" text-anchor="middle">object store</text>
  <text x="230" y="338" fill="#f87171" font-size="12" text-anchor="middle">needs Java 11</text>

  <rect x="340" y="290" width="180" height="60" rx="8" fill="#1e293b" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="430" y="318" fill="#e2e8f0" font-size="15" text-anchor="middle">Spark</text>
  <text x="430" y="338" fill="#f87171" font-size="12" text-anchor="middle">needs Java 17</text>

  <rect x="140" y="368" width="180" height="60" rx="8" fill="#1e293b" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="230" y="396" fill="#e2e8f0" font-size="15" text-anchor="middle">catalog</text>
  <text x="230" y="416" fill="#f87171" font-size="12" text-anchor="middle">needs Postgres 14</text>

  <rect x="340" y="368" width="180" height="60" rx="8" fill="#1e293b" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="430" y="396" fill="#e2e8f0" font-size="15" text-anchor="middle">Kafka</text>
  <text x="430" y="416" fill="#f87171" font-size="12" text-anchor="middle">needs Postgres 16</text>

  <!-- collision zone -->
  <path d="M320 350 L340 368 M340 350 L320 368" stroke="#ef4444" stroke-width="3"/>
  <rect x="150" y="470" width="360" height="100" rx="10" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="330" y="502" fill="#f87171" font-size="16" font-weight="700" text-anchor="middle">version conflicts</text>
  <text x="330" y="528" fill="#cbd5e1" font-size="14" text-anchor="middle">two Java versions, two Postgres versions,</text>
  <text x="330" y="550" fill="#cbd5e1" font-size="14" text-anchor="middle">and it only works on your laptop</text>

  <!-- RIGHT: containers -->
  <rect x="690" y="140" width="520" height="500" rx="20" fill="#0b1a17" stroke="#166534" stroke-width="2"/>
  <text x="950" y="182" fill="#4ade80" font-size="24" font-weight="700" text-anchor="middle">Each service in a container</text>
  <text x="950" y="212" fill="#94a3b8" font-size="16" text-anchor="middle">every service brings its own dependencies</text>

  <!-- docker slab -->
  <rect x="730" y="240" width="440" height="360" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="950" y="268" fill="#cbd5e1" font-size="15" font-weight="600" text-anchor="middle">Docker on your OS</text>

  <rect x="760" y="290" width="180" height="80" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="850" y="322" fill="#e2e8f0" font-size="15" text-anchor="middle">object store</text>
  <text x="850" y="346" fill="#38bdf8" font-size="12" text-anchor="middle">+ its own Java 11</text>

  <rect x="960" y="290" width="180" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1050" y="322" fill="#e2e8f0" font-size="15" text-anchor="middle">Spark</text>
  <text x="1050" y="346" fill="#60a5fa" font-size="12" text-anchor="middle">+ its own Java 17</text>

  <rect x="760" y="388" width="180" height="80" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="850" y="420" fill="#e2e8f0" font-size="15" text-anchor="middle">catalog</text>
  <text x="850" y="444" fill="#4ade80" font-size="12" text-anchor="middle">+ its own Postgres 14</text>

  <rect x="960" y="388" width="180" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1050" y="420" fill="#e2e8f0" font-size="15" text-anchor="middle">Kafka</text>
  <text x="1050" y="444" fill="#fbbf24" font-size="12" text-anchor="middle">+ its own Postgres 16</text>

  <rect x="770" y="490" width="360" height="80" rx="10" fill="#0f172a" stroke="#166534" stroke-width="1.5"/>
  <text x="950" y="522" fill="#4ade80" font-size="16" font-weight="700" text-anchor="middle">no conflicts, reproducible</text>
  <text x="950" y="548" fill="#cbd5e1" font-size="14" text-anchor="middle">isolated, and runs the same on any machine</text>
</svg>
