<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="56" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">Two ways to run the stack</text>
  <text x="640" y="94" fill="#94a3b8" font-size="20" text-anchor="middle">Install everything on your host, or run each service in its own container</text>

  <!-- LEFT: install on host (the messy way) -->
  <rect x="70" y="140" width="540" height="500" rx="18" fill="#1a1420" stroke="#7f1d1d" stroke-width="2"/>
  <text x="340" y="180" fill="#f87171" font-size="24" font-weight="700" text-anchor="middle">Installed on your host</text>
  <text x="340" y="208" fill="#94a3b8" font-size="16" text-anchor="middle">one machine, everything tangled together</text>

  <rect x="110" y="240" width="460" height="360" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="340" y="270" fill="#cbd5e1" font-size="17" font-weight="600" text-anchor="middle">Your operating system</text>

  <!-- tangled installs -->
  <rect x="140" y="292" width="180" height="54" rx="8" fill="#1e293b" stroke="#7f1d1d"/>
  <text x="230" y="325" fill="#e2e8f0" font-size="15" text-anchor="middle">Spark + Java 21</text>
  <rect x="360" y="292" width="180" height="54" rx="8" fill="#1e293b" stroke="#7f1d1d"/>
  <text x="450" y="325" fill="#e2e8f0" font-size="15" text-anchor="middle">Kafka + Scala</text>
  <rect x="140" y="360" width="180" height="54" rx="8" fill="#1e293b" stroke="#7f1d1d"/>
  <text x="230" y="393" fill="#e2e8f0" font-size="15" text-anchor="middle">Postgres</text>
  <rect x="360" y="360" width="180" height="54" rx="8" fill="#1e293b" stroke="#7f1d1d"/>
  <text x="450" y="393" fill="#e2e8f0" font-size="15" text-anchor="middle">object store</text>
  <!-- conflict crossing lines -->
  <g stroke="#ef4444" stroke-width="2" opacity="0.7">
    <line x1="320" y1="319" x2="360" y2="387"/>
    <line x1="320" y1="387" x2="360" y2="319"/>
  </g>
  <text x="340" y="452" fill="#f87171" font-size="15" text-anchor="middle">version conflicts, shared dependencies</text>

  <text x="340" y="500" fill="#fca5a5" font-size="16" text-anchor="middle">✗ "works on my machine"</text>
  <text x="340" y="530" fill="#fca5a5" font-size="16" text-anchor="middle">✗ can't restart one without the others</text>
  <text x="340" y="560" fill="#fca5a5" font-size="16" text-anchor="middle">✗ nothing like production</text>

  <!-- RIGHT: containers (the clean way) -->
  <rect x="670" y="140" width="540" height="500" rx="18" fill="#0b1a17" stroke="#166534" stroke-width="2"/>
  <text x="940" y="180" fill="#4ade80" font-size="24" font-weight="700" text-anchor="middle">Each service in a container</text>
  <text x="940" y="208" fill="#94a3b8" font-size="16" text-anchor="middle">isolated, reproducible, host stays clean</text>

  <rect x="710" y="240" width="460" height="360" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="940" y="270" fill="#cbd5e1" font-size="17" font-weight="600" text-anchor="middle">Your operating system</text>
  <rect x="730" y="286" width="420" height="40" rx="8" fill="#0c4a6e" opacity="0.7"/>
  <text x="940" y="312" fill="#e0f2fe" font-size="16" font-weight="600" text-anchor="middle">Docker</text>

  <!-- clean isolated container boxes -->
  <rect x="740" y="340" width="190" height="70" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="835" y="372" fill="#e2e8f0" font-size="15" text-anchor="middle">Spark</text>
  <text x="835" y="393" fill="#64748b" font-size="12" text-anchor="middle">own Java, isolated</text>
  <rect x="950" y="340" width="190" height="70" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1045" y="372" fill="#e2e8f0" font-size="15" text-anchor="middle">Kafka</text>
  <text x="1045" y="393" fill="#64748b" font-size="12" text-anchor="middle">own deps, isolated</text>
  <rect x="740" y="424" width="190" height="70" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="835" y="456" fill="#e2e8f0" font-size="15" text-anchor="middle">Postgres</text>
  <text x="835" y="477" fill="#64748b" font-size="12" text-anchor="middle">own deps, isolated</text>
  <rect x="950" y="424" width="190" height="70" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1045" y="456" fill="#e2e8f0" font-size="15" text-anchor="middle">object store</text>
  <text x="1045" y="477" fill="#64748b" font-size="12" text-anchor="middle">own deps, isolated</text>

  <text x="940" y="530" fill="#86efac" font-size="16" text-anchor="middle">✓ same stack on every machine</text>
  <text x="940" y="560" fill="#86efac" font-size="16" text-anchor="middle">✓ start, stop, swap each on its own</text>
</svg>
