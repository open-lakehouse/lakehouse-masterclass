<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="56" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">How a secret reaches a service</text>
  <text x="640" y="94" fill="#94a3b8" font-size="20" text-anchor="middle">Kept in a gitignored file, injected at runtime, never baked in</text>

  <defs>
    <marker id="sf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- the good path -->
  <text x="640" y="150" fill="#4ade80" font-size="20" font-weight="700" text-anchor="middle">The pattern</text>

  <!-- .env -->
  <rect x="90" y="180" width="300" height="150" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="240" y="216" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">.env</text>
  <text x="240" y="244" fill="#f87171" font-size="14" text-anchor="middle">gitignored, never committed</text>
  <rect x="118" y="262" width="244" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="240" y="292" fill="#4ade80" font-size="15" font-family="monospace" text-anchor="middle">MINIO_PASSWORD=s3cr3t</text>

  <!-- compose reads it -->
  <rect x="490" y="180" width="300" height="150" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <text x="640" y="216" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">Compose</text>
  <text x="640" y="244" fill="#94a3b8" font-size="14" text-anchor="middle">reads .env, references by name</text>
  <rect x="518" y="262" width="244" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="640" y="292" fill="#38bdf8" font-size="14" font-family="monospace" text-anchor="middle">${MINIO_PASSWORD}</text>

  <!-- container -->
  <rect x="890" y="180" width="300" height="150" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="1040" y="216" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">Container</text>
  <text x="1040" y="244" fill="#94a3b8" font-size="14" text-anchor="middle">gets it as an env var at runtime</text>
  <rect x="918" y="262" width="244" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="1040" y="292" fill="#c4b5fd" font-size="15" font-family="monospace" text-anchor="middle">env: MINIO_PASSWORD</text>

  <line x1="390" y1="255" x2="485" y2="255" stroke="#22c55e" stroke-width="3" marker-end="url(#sf)"/>
  <line x1="790" y1="255" x2="885" y2="255" stroke="#22c55e" stroke-width="3" marker-end="url(#sf)"/>

  <!-- anti-patterns -->
  <text x="640" y="418" fill="#f87171" font-size="20" font-weight="700" text-anchor="middle">Never do this</text>

  <rect x="120" y="446" width="330" height="150" rx="12" fill="#1a1420" stroke="#7f1d1d" stroke-width="2"/>
  <text x="285" y="480" fill="#f87171" font-size="17" font-weight="700" text-anchor="middle">hardcode in Compose</text>
  <rect x="146" y="500" width="278" height="44" rx="8" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="285" y="527" fill="#94a3b8" font-size="13" font-family="monospace" text-anchor="middle">password: "s3cr3t"</text>
  <text x="285" y="574" fill="#cbd5e1" font-size="14" text-anchor="middle">committed to git forever</text>

  <rect x="475" y="446" width="330" height="150" rx="12" fill="#1a1420" stroke="#7f1d1d" stroke-width="2"/>
  <text x="640" y="480" fill="#f87171" font-size="17" font-weight="700" text-anchor="middle">bake into the image</text>
  <rect x="501" y="500" width="278" height="44" rx="8" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="640" y="527" fill="#94a3b8" font-size="13" font-family="monospace" text-anchor="middle">ENV PASSWORD=s3cr3t</text>
  <text x="640" y="574" fill="#cbd5e1" font-size="14" text-anchor="middle">ships with every copy of the image</text>

  <rect x="830" y="446" width="330" height="150" rx="12" fill="#1a1420" stroke="#7f1d1d" stroke-width="2"/>
  <text x="995" y="480" fill="#f87171" font-size="17" font-weight="700" text-anchor="middle">commit the .env</text>
  <rect x="856" y="500" width="278" height="44" rx="8" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="995" y="527" fill="#94a3b8" font-size="13" font-family="monospace" text-anchor="middle">git add .env</text>
  <text x="995" y="574" fill="#cbd5e1" font-size="14" text-anchor="middle">lives in history even after deletion</text>

  <text x="640" y="638" fill="#64748b" font-size="15" text-anchor="middle">In production, a secret manager (Vault, cloud secret store) formalizes this same habit.</text>
</svg>
