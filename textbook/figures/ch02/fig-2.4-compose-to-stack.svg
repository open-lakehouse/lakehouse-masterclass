<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="56" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">The Compose file is your infrastructure</text>
  <text x="640" y="94" fill="#94a3b8" font-size="20" text-anchor="middle">One block per service in the file becomes one running container</text>

  <!-- LEFT: the file -->
  <rect x="70" y="140" width="520" height="500" rx="16" fill="#0b1120" stroke="#334155" stroke-width="2"/>
  <text x="330" y="176" fill="#cbd5e1" font-size="20" font-weight="700" text-anchor="middle">docker-compose.yml</text>

  <!-- minio block -->
  <rect x="100" y="200" width="460" height="118" rx="10" fill="#111c2e" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="120" y="228" fill="#38bdf8" font-size="16" font-family="monospace">services:</text>
  <text x="140" y="254" fill="#e2e8f0" font-size="16" font-family="monospace">minio:</text>
  <text x="160" y="280" fill="#94a3b8" font-size="15" font-family="monospace">image: minio/minio</text>
  <text x="160" y="304" fill="#94a3b8" font-size="15" font-family="monospace">ports: ["9000:9000"]</text>

  <!-- spark block -->
  <rect x="100" y="332" width="460" height="96" rx="10" fill="#111c2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="360" fill="#e2e8f0" font-size="16" font-family="monospace">spark:</text>
  <text x="160" y="386" fill="#94a3b8" font-size="15" font-family="monospace">image: spark:4.1</text>
  <text x="160" y="410" fill="#94a3b8" font-size="15" font-family="monospace">depends_on: [minio]</text>

  <!-- catalog block -->
  <rect x="100" y="442" width="460" height="96" rx="10" fill="#111c2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="140" y="470" fill="#e2e8f0" font-size="16" font-family="monospace">catalog:</text>
  <text x="160" y="496" fill="#94a3b8" font-size="15" font-family="monospace">image: unitycatalog</text>
  <text x="160" y="520" fill="#94a3b8" font-size="15" font-family="monospace">ports: ["8081:8081"]</text>

  <text x="330" y="580" fill="#64748b" font-size="15" text-anchor="middle">readable, versioned in git, re-runnable</text>
  <text x="330" y="606" fill="#64748b" font-size="15" text-anchor="middle">the source of truth for your stack</text>

  <!-- arrows: docker compose up -->
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#f8fafc"/>
    </marker>
  </defs>
  <rect x="600" y="358" width="80" height="44" rx="10" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="640" y="378" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">docker</text>
  <text x="640" y="394" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">compose up</text>
  <line x1="620" y1="259" x2="620" y2="358" stroke="#475569" stroke-width="2"/>
  <line x1="620" y1="490" x2="620" y2="402" stroke="#475569" stroke-width="2"/>
  <line x1="680" y1="380" x2="720" y2="380" stroke="#f8fafc" stroke-width="3" marker-end="url(#arr)"/>

  <!-- RIGHT: running containers -->
  <rect x="700" y="140" width="510" height="500" rx="16" fill="#0b1a17" stroke="#166534" stroke-width="2"/>
  <text x="955" y="176" fill="#4ade80" font-size="20" font-weight="700" text-anchor="middle">Running containers</text>

  <rect x="740" y="210" width="430" height="108" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="770" cy="240" r="7" fill="#22c55e"/>
  <text x="800" y="246" fill="#f1f5f9" font-size="19" font-weight="700">minio</text>
  <text x="800" y="274" fill="#94a3b8" font-size="14">object store, running</text>
  <text x="800" y="298" fill="#38bdf8" font-size="14" font-family="monospace">reachable at minio:9000</text>

  <rect x="740" y="332" width="430" height="96" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="770" cy="362" r="7" fill="#22c55e"/>
  <text x="800" y="368" fill="#f1f5f9" font-size="19" font-weight="700">spark</text>
  <text x="800" y="396" fill="#94a3b8" font-size="14">compute, running</text>

  <rect x="740" y="442" width="430" height="96" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <circle cx="770" cy="472" r="7" fill="#22c55e"/>
  <text x="800" y="478" fill="#f1f5f9" font-size="19" font-weight="700">catalog</text>
  <text x="800" y="506" fill="#94a3b8" font-size="14">table metadata, running</text>

  <text x="955" y="586" fill="#86efac" font-size="15" text-anchor="middle">all on one private network, up together</text>
  <text x="955" y="612" fill="#64748b" font-size="15" text-anchor="middle">docker compose down tears them all back down</text>
</svg>
