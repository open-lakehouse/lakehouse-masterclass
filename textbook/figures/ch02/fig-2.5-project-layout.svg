<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="56" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">The project layout</text>
  <text x="640" y="94" fill="#94a3b8" font-size="20" text-anchor="middle">A home for each kind of thing you'll build over the course</text>

  <!-- tree panel -->
  <rect x="150" y="150" width="440" height="470" rx="16" fill="#0b1120" stroke="#334155" stroke-width="2"/>
  <text x="200" y="205" fill="#fbbf24" font-size="22" font-family="monospace" font-weight="700">open-lakehouse/</text>

  <!-- tree lines -->
  <g font-family="monospace" font-size="19">
    <text x="230" y="258" fill="#64748b">├──</text>
    <text x="285" y="258" fill="#38bdf8" font-weight="700">compose/</text>
    <text x="230" y="316" fill="#64748b">├──</text>
    <text x="285" y="316" fill="#a78bfa" font-weight="700">config/</text>
    <text x="230" y="374" fill="#64748b">├──</text>
    <text x="285" y="374" fill="#4ade80" font-weight="700">pipelines/</text>
    <text x="230" y="432" fill="#64748b">├──</text>
    <text x="285" y="432" fill="#f87171" font-weight="700">data/</text>
    <text x="230" y="490" fill="#64748b">├──</text>
    <text x="285" y="490" fill="#cbd5e1">.env</text>
    <text x="470" y="490" fill="#64748b" font-size="14">(gitignored)</text>
    <text x="230" y="548" fill="#64748b">└──</text>
    <text x="285" y="548" fill="#cbd5e1">.gitignore</text>
  </g>
  <text x="370" y="600" fill="#64748b" font-size="15" text-anchor="middle">git init'd, nothing load-bearing yet</text>

  <!-- annotations panel -->
  <g>
    <rect x="640" y="232" width="500" height="52" rx="10" fill="#111c2e" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="664" y="264" fill="#38bdf8" font-size="17" font-family="monospace" font-weight="700">compose/</text>
    <text x="800" y="264" fill="#cbd5e1" font-size="16">service definitions (your infra)</text>

    <rect x="640" y="290" width="500" height="52" rx="10" fill="#141127" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="664" y="322" fill="#a78bfa" font-size="17" font-family="monospace" font-weight="700">config/</text>
    <text x="790" y="322" fill="#cbd5e1" font-size="16">non-secret settings files</text>

    <rect x="640" y="348" width="500" height="72" rx="10" fill="#0b1a17" stroke="#22c55e" stroke-width="1.5"/>
    <text x="664" y="380" fill="#4ade80" font-size="17" font-family="monospace" font-weight="700">pipelines/</text>
    <text x="790" y="380" fill="#cbd5e1" font-size="16">data pipelines live here</text>
    <text x="790" y="404" fill="#64748b" font-size="14">scaffolded by spark-pipelines init</text>

    <rect x="640" y="426" width="500" height="52" rx="10" fill="#1a1420" stroke="#f87171" stroke-width="1.5"/>
    <text x="664" y="458" fill="#f87171" font-size="17" font-family="monospace" font-weight="700">data/</text>
    <text x="770" y="458" fill="#cbd5e1" font-size="16">local scratch (not committed)</text>
  </g>
</svg>
