<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="56" fill="#f8fafc" font-size="38" font-weight="700" text-anchor="middle">A home for everything you'll build</text>
  <text x="640" y="94" fill="#94a3b8" font-size="20" text-anchor="middle">The project layout, and what each folder will hold</text>

  <!-- tree column -->
  <rect x="120" y="150" width="440" height="470" rx="14" fill="#0b1120" stroke="#334155" stroke-width="2"/>

  <text x="150" y="200" fill="#f8fafc" font-size="22" font-family="monospace" font-weight="700">open-lakehouse/</text>

  <!-- tree lines -->
  <text x="180" y="252" fill="#64748b" font-size="18" font-family="monospace">├──</text>
  <text x="235" y="252" fill="#0ea5e9" font-size="19" font-family="monospace" font-weight="700">compose/</text>

  <text x="180" y="316" fill="#64748b" font-size="18" font-family="monospace">├──</text>
  <text x="235" y="316" fill="#22c55e" font-size="19" font-family="monospace" font-weight="700">config/</text>

  <text x="180" y="380" fill="#64748b" font-size="18" font-family="monospace">├──</text>
  <text x="235" y="380" fill="#a78bfa" font-size="19" font-family="monospace" font-weight="700">pipelines/</text>

  <text x="180" y="444" fill="#64748b" font-size="18" font-family="monospace">├──</text>
  <text x="235" y="444" fill="#f59e0b" font-size="19" font-family="monospace" font-weight="700">data/</text>

  <text x="180" y="508" fill="#64748b" font-size="18" font-family="monospace">├──</text>
  <text x="235" y="508" fill="#e2e8f0" font-size="19" font-family="monospace">.env</text>
  <text x="420" y="508" fill="#f87171" font-size="14" font-family="monospace">gitignored</text>

  <text x="180" y="572" fill="#64748b" font-size="18" font-family="monospace">└──</text>
  <text x="235" y="572" fill="#e2e8f0" font-size="19" font-family="monospace">.gitignore</text>

  <!-- annotations column -->
  <rect x="620" y="222" width="540" height="60" rx="10" fill="#111c2e" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="644" y="248" fill="#38bdf8" font-size="17" font-weight="700">compose/</text>
  <text x="644" y="270" fill="#cbd5e1" font-size="15">service definitions: your infrastructure, written down</text>

  <rect x="620" y="286" width="540" height="60" rx="10" fill="#0d1f16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="644" y="312" fill="#4ade80" font-size="17" font-weight="700">config/</text>
  <text x="644" y="334" fill="#cbd5e1" font-size="15">non-secret settings each service reads</text>

  <rect x="620" y="350" width="540" height="60" rx="10" fill="#171429" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="644" y="376" fill="#c4b5fd" font-size="17" font-weight="700">pipelines/</text>
  <text x="644" y="398" fill="#cbd5e1" font-size="15">spark-pipelines init scaffolds your project here</text>

  <rect x="620" y="414" width="540" height="60" rx="10" fill="#1f1710" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="644" y="440" fill="#fbbf24" font-size="17" font-weight="700">data/</text>
  <text x="644" y="462" fill="#cbd5e1" font-size="15">local scratch space, never committed</text>

  <rect x="620" y="478" width="540" height="94" rx="10" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="644" y="504" fill="#f87171" font-size="17" font-weight="700">.env + .gitignore</text>
  <text x="644" y="528" fill="#cbd5e1" font-size="15">secrets live in .env, which .gitignore excludes.</text>
  <text x="644" y="550" fill="#cbd5e1" font-size="15">The .gitignore is your very first commit, before</text>
  <text x="644" y="568" fill="#cbd5e1" font-size="15">any real credential exists.</text>
</svg>
