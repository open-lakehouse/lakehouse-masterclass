# Film-only tmux config for sessions-crash (its own server, tmux -L film2).
set -g status off
set -g default-terminal "screen-256color"
set -g escape-time 0
set -g history-limit 5000
set -g window-size latest
set -g mouse off
set -g allow-rename off
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour208,bold"
# Alt+p/j/q picks the producer, customer_sessions and query panes.
bind -n M-p select-pane -t 0
bind -n M-j select-pane -t 1
bind -n M-q select-pane -t 2
