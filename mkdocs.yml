site_name: Build Your First Open Lakehouse
site_description: >-
  Build a complete open-source data lakehouse from scratch on your own machine:
  storage, compute, tables, ingestion, transformation, streaming, orchestration,
  serving, AI, and agents.
site_url: https://open-lakehouse.github.io/lakehouse-masterclass/
site_author: open-lakehouse

repo_url: https://github.com/open-lakehouse/lakehouse-masterclass
repo_name: open-lakehouse/lakehouse-masterclass
edit_uri: edit/main/textbook/

docs_dir: textbook

# Keep the GitHub repo README, the figure generator and the clip tooling out of the built site.
exclude_docs: |
  README.md
  figures/_tools/
  media/clips/out/
  media/clips/cut.sh
  media/clips/clips.tsv

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - "1. Foundations": chapters/ch01-foundations.md
  - "2. Setup": chapters/ch02-setup.md
  - "3. Agentic data engineering": chapters/ch03-agentic-data-engineering.md
  - "4. Storage": chapters/ch04-storage.md
  - "5. Compute": chapters/ch05-compute.md
  - "5.5. Iceberg for Spark 4.3": chapters/ch05-5-iceberg-runtime.md
  - "6. Tables and Catalog": chapters/ch06-tables-catalog.md
  - "7. Ingestion": chapters/ch07-ingestion.md
  - "8. Transformation": chapters/ch08-transformation.md
  - "9. Streaming": chapters/ch09-streaming.md
  - "10. Orchestration": chapters/ch10-orchestration.md
  - "11. Serving": chapters/ch11-serving.md
  - "12. AI": chapters/ch12-ai.md
  - "13. Agents": chapters/ch13-agents.md
  - "14. Deploy and Teardown": chapters/ch14-deploy-teardown.md
