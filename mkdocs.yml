site_name: Build Your First Open Lakehouse
site_description: >-
  Build a complete open-source data lakehouse from scratch on your own machine:
  storage, compute, tables, ingestion, transformation, streaming, orchestration,
  serving, AI, and agents.
site_url: https://open-lakehouse.github.io/lakehouse-masterclass/
site_author: open-lakehouse

repo_url: https://github.com/open-lakehouse/lakehouse-masterclass
repo_name: open-lakehouse/lakehouse-masterclass
edit_uri: edit/main/textbook/

docs_dir: textbook

# Keep the GitHub repo README and the figure generator out of the built site.
exclude_docs: |
  README.md
  figures/_tools/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - "1. Foundations": chapters/ch01-foundations.md
  - "2. Setup": chapters/ch02-setup.md
  - "3. Storage": chapters/ch03-storage.md
  - "4. Compute": chapters/ch04-compute.md
  - "5. Tables and Catalog": chapters/ch05-tables-catalog.md
  - "6. Ingestion": chapters/ch06-ingestion.md
  - "7. Transformation": chapters/ch07-transformation.md
  - "8. Streaming": chapters/ch08-streaming.md
  - "9. Orchestration": chapters/ch09-orchestration.md
  - "10. Serving": chapters/ch10-serving.md
  - "11. AI": chapters/ch11-ai.md
  - "12. Agents": chapters/ch12-agents.md
  - "13. Deploy and Teardown": chapters/ch13-deploy-teardown.md
